name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Proje yapısı ve JSON doğrulama
  # ─────────────────────────────────────────────
  validate:
    name: Project Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unity klasör yapısını kontrol et
        run: |
          echo "=== Zorunlu klasörler kontrol ediliyor ==="
          required_dirs=(
            "Assets/_Game/Cards"
            "Assets/_Game/Data"
            "Assets/_Game/Art"
            "Assets/_Game/Characters"
            "Assets/_Game/Combat"
            "Assets/_Game/Systems"
            "Assets/_Game/Economy"
            "Assets/_Game/Progression"
            "Assets/_Game/VFX"
            "Assets/_Game/UI"
            "Assets/_Game/Audio"
            "Assets/Scenes"
            "Assets/Tests/EditMode"
            "Assets/Tests/PlayMode"
            "ProjectSettings"
            "Packages"
          )
          missing=0
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✓ $dir"
            else
              echo "  ✗ EKSIK: $dir"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "HATA: $missing zorunlu klasör eksik!"
            exit 1
          fi
          echo "Tüm zorunlu klasörler mevcut."

      - name: Unity JSON dosyalarını doğrula
        run: |
          echo "=== JSON dosyaları doğrulanıyor ==="
          json_files=(
            "Packages/manifest.json"
            "Packages/packages-lock.json"
          )
          error=0
          for f in "${json_files[@]}"; do
            if [ -f "$f" ]; then
              if python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
                echo "  ✓ $f"
              else
                echo "  ✗ GEÇERSİZ JSON: $f"
                error=1
              fi
            else
              echo "  - Atlandı (yok): $f"
            fi
          done
          if [ $error -ne 0 ]; then
            echo "HATA: Geçersiz JSON dosyası var!"
            exit 1
          fi

      - name: Unity proje versiyonunu raporla
        run: |
          if [ -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "=== Unity Versiyon ==="
            cat ProjectSettings/ProjectVersion.txt
          fi

      - name: C# script dosyalarını say ve raporla
        run: |
          echo "=== C# Script Durumu ==="
          count=$(find Assets -name "*.cs" | wc -l)
          echo "Toplam .cs dosyası: $count"
          if [ $count -gt 0 ]; then
            find Assets -name "*.cs" | sort
          else
            echo "(Henüz script yok — Sprint 1 başlangıcı)"
          fi

  # ─────────────────────────────────────────────
  # 2. C# syntax kontrolü (script varsa)
  #
  #    NEDEN .sln YOK?
  #    Unity .sln dosyasını editör her açılışta yeniden üretir.
  #    Bu dosyalar .gitignore tarafından dışlanır; CI ortamında
  #    hiçbir zaman mevcut olmaz ve sabit bir isimle aranamaz.
  #
  #    ÇÖZÜM — find tabanlı geçici .csproj:
  #    Tüm .cs dosyaları find ile toplanır, geçici minimal bir
  #    .csproj oluşturulur ve Roslyn derleyicisi aracılığıyla
  #    syntax kontrolü yapılır.
  #
  #    Unity'ye özgü tipler (MonoBehaviour, ScriptableObject vb.)
  #    derleyici tarafından tanınmaz — bu beklenen bir durumdur.
  #    CS0234/CS0246 (bilinmeyen tip) uyarı olarak bırakılmıştır.
  #    Gerçek syntax hataları (CS1002, CS1513 vb.) build'i kırar.
  # ─────────────────────────────────────────────
  csharp-check:
    name: C# Syntax Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .cs dosyası var mı kontrol et
        id: check_scripts
        run: |
          count=$(find Assets -name "*.cs" | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "C# dosya sayısı: $count"

      - name: .NET SDK kur
        if: steps.check_scripts.outputs.count != '0'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C# syntax kontrolü (.sln olmadan, find tabanlı)
        if: steps.check_scripts.outputs.count != '0'
        run: |
          echo "=== C# Syntax Kontrolü ==="

          # Tüm .cs dosyalarını topla
          mapfile -t cs_files < <(find Assets -name "*.cs" | sort)
          echo "Kontrol edilecek dosya sayısı: ${#cs_files[@]}"

          # Geçici minimal .csproj oluştur
          cat > /tmp/SyntaxCheck.csproj << 'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Library</OutputType>
              <TargetFramework>netstandard2.1</TargetFramework>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <!-- Unity API tipleri bilinmeyeceği için tip hataları uyarıya alındı -->
              <!-- Gerçek syntax hataları (CS1002 vb.) yine de build'i kırar       -->
              <NoWarn>CS0234;CS0246;CS8019</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              PLACEHOLDER
            </ItemGroup>
          </Project>
          CSPROJ

          # Her .cs dosyasını <Compile Include="..."/> satırı olarak ekle
          compile_items=""
          for f in "${cs_files[@]}"; do
            abs=$(realpath "$f")
            compile_items="$compile_items<Compile Include=\"$abs\" />"
          done
          sed -i "s|PLACEHOLDER|$compile_items|g" /tmp/SyntaxCheck.csproj

          # Derle — çıktının son 30 satırını göster
          cd /tmp
          dotnet build SyntaxCheck.csproj \
            --no-restore \
            -v minimal \
            2>&1 | tail -30

          echo "=== Syntax kontrolü tamamlandı ==="

      - name: Script yok — kontrol atlandı
        if: steps.check_scripts.outputs.count == '0'
        run: echo "C# dosyası henüz yok, syntax kontrolü atlandı."
